[env]
TERM = "xterm-256color"

[general]
import = [
    "~/.config/alacritty/themes/themes/tomorrow_night_bright.toml"
]

[font]
normal = { family = "Terminess Nerd Font Mono", style = "Regular" }
bold = { family = "Terminess Nerd Font Mono", style = "Bold" }
italic = { family = "Terminess Nerd Font Mono", style = "Italic" }
size = 13

[window]
padding = { x = 14, y = 14 }
dimensions = { columns = 180, lines = 100 }
decorations = "None"
opacity = 0.8

[keyboard]
bindings = [
{ key = "Insert", mods = "Shift", action = "Paste" },
{ key = "Insert", mods = "Control", action = "Copy" }
]
